name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Cap'n Proto
        run: sudo apt-get update && sudo apt-get install -y capnproto
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cargo Check
        run: cargo check --manifest-path rust-engine/Cargo.toml

  ocaml-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build OCaml swarm in container
        run: |
          docker run --rm --user root -v ${{ github.workspace }}:/workspace -w /workspace/ocaml-brain ocaml/opam:ubuntu-24.04-ocaml-5.2 bash -c "
            chown -R opam:opam /workspace/ocaml-brain
            su opam -c 'opam install -y dune domainslib && eval \$(opam env) && dune build'
            chown -R $(id -u):$(id -g) /workspace
          "
