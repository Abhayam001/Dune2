name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Cap'n Proto
        run: sudo apt-get update && sudo apt-get install -y capnproto
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cargo Check
        run: cargo check --manifest-path rust-engine/Cargo.toml

  ocaml-check:
    runs-on: ubuntu-latest
    container:
      image: ocaml/opam:ubuntu-24.04-ocaml-5.2
    steps:
      - uses: actions/checkout@v4
      - name: Build OCaml swarm
        run: |
          sudo chown -R opam:opam .
          opam install -y dune domainslib
          cd ocaml-brain
          eval $(opam env)
          dune build
